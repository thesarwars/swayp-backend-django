# Dev stack. The app image runs as a non-root user (uid 10001), and a bind
# mount presents the Windows host's ownership rather than the image's — so
# every path the app writes to is a named volume instead of the host mount.
# Without that, collectstatic dies on Permission denied and beat cannot write
# its schedule. The source bind mount stays, since the container only reads it.

services:
  db:
    image: postgres:16-alpine
    container_name: swayp-db
    environment:
      POSTGRES_DB: swayp_db
      POSTGRES_USER: swayp
      POSTGRES_PASSWORD: swayp123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swayp -d swayp_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: swayp-redis
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: swayp-web
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && python manage.py runserver 0.0.0.0:5010"
    volumes:
      - .:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    ports:
      - "5010:5010"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_DB: swayp_db
      POSTGRES_USER: swayp
      POSTGRES_PASSWORD: swayp123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-worker:
    build: .
    container_name: swayp-celery-worker
    command: celery -A config worker -l info
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_DB: swayp_db
      POSTGRES_USER: swayp
      POSTGRES_PASSWORD: swayp123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery-beat:
    build: .
    container_name: swayp-celery-beat
    # --schedule puts beat's "when did each task last run" file on a volume.
    # The default is /app/celerybeat-schedule, which is the read-only-in-effect
    # host mount.
    command: celery -A config beat -l info --schedule /var/lib/celery/celerybeat-schedule
    volumes:
      - .:/app
      - beat_data:/var/lib/celery
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.local
      POSTGRES_DB: swayp_db
      POSTGRES_USER: swayp
      POSTGRES_PASSWORD: swayp123
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  static_data:
  media_data:
  beat_data:
